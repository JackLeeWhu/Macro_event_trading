   <g id="text_1">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007e87" x="82.4688" y="155.276412" transform="rotate(-0 82.4688 155.276412)">INFORMATION STREAM A</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17334c" x="82.4688" y="180.536296" transform="rotate(-0 82.4688 180.536296)">High-frequency food prices</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5b6d79" transform="translate(82.4688 202.103165)">Smooth component prices; aggregate changes</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5b6d79" transform="translate(82.4688 215.96043)">using lagged inverse-volatility weights.</text>
   </g>
   <g id="line2d_2">
    <path d="M 472.97952 228.106473 
L 472.97952 138.682473 
" clip-path="url(#p37ab72b1bb)" style="fill: none; stroke: #bd7139; stroke-width: 3; stroke-linecap: square"/>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #bd7139" x="490.65696" y="155.276412" transform="rotate(-0 490.65696 155.276412)">INFORMATION STREAM B</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17334c" x="490.65696" y="180.536296" transform="rotate(-0 490.65696 180.536296)">CPI forecasts and realized CPI</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5b6d79" transform="translate(490.65696 202.103165)">Align reference months and units;</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5b6d79" transform="translate(490.65696 215.96043)">robustly summarize forecast disagreement.</text>
   </g>
   <g id="line2d_3">
    <path d="M 64.79136 387.443782 
L 64.79136 298.019782 
" clip-path="url(#p37ab72b1bb)" style="fill: none; stroke: #007e87; stroke-width: 3; stroke-linecap: square"/>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007e87" x="82.4688" y="314.613721" transform="rotate(-0 82.4688 314.613721)">STRICTLY BEFORE RELEASE</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17334c" x="82.4688" y="339.873605" transform="rotate(-0 82.4688 339.873605)">Pre-release movement score</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5b6d79" transform="translate(82.4688 361.440474)">Compare adjacent windows of the daily proxy.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5b6d79" transform="translate(82.4688 375.297739)">Interpretation: an estimate of priced-in information.</text>
   </g>
   <g id="line2d_4">
    <path d="M 472.97952 387.443782 
L 472.97952 298.019782 
" clip-path="url(#p37ab72b1bb)" style="fill: none; stroke: #bd7139; stroke-width: 3; stroke-linecap: square"/>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #bd7139" x="490.65696" y="314.613721" transform="rotate(-0 490.65696 314.613721)">AFTER ACTUAL CPI IS RELEASED</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17334c" x="490.65696" y="339.873605" transform="rotate(-0 490.65696 339.873605)">Survey surprise score</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5b6d79" transform="translate(490.65696 361.440474)">Realized CPI relative to forecast consensus,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5b6d79" transform="translate(490.65696 375.297739)">scaled by dispersion and bounded.</text>
   </g>
   <g id="line2d_5">
    <path d="M 177.28416 537.567709 
L 177.28416 457.357091 
" clip-path="url(#p37ab72b1bb)" style="fill: none; stroke: #007e87; stroke-width: 3; stroke-linecap: square"/>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007e87" x="194.9616" y="473.95103" transform="rotate(-0 194.9616 473.95103)">COMBINE THE INFORMATION</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17334c" x="194.9616" y="499.210914" transform="rotate(-0 194.9616 499.210914)">Adjusted surprise = survey score − pre-release score</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5b6d79" transform="translate(194.9616 520.777783)">Negative score: hypothesized support for duration.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5b6d79" transform="translate(194.9616 534.635049)">Positive score: hypothesized adverse inflation news.</text>
   </g>
   <g id="line2d_6">
    <path d="M 64.79136 687.691636 
L 64.79136 609.106909 
" clip-path="url(#p37ab72b1bb)" style="fill: none; stroke: #007e87; stroke-width: 3; stroke-linecap: square"/>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007e87" x="82.4688" y="625.700848" transform="rotate(-0 82.4688 625.700848)">PORTFOLIO TRANSLATION</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17334c" x="82.4688" y="650.960732" transform="rotate(-0 82.4688 650.960732)">Duration overlay + risk filter</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5b6d79" transform="translate(82.4688 672.527601)">Baseline 1×; favorable event target 2×;</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5b6d79" transform="translate(82.4688 686.384867)">return filter can reduce exposure to cash.</text>
   </g>
   <g id="line2d_7">
    <path d="M 472.97952 687.691636 
L 472.97952 609.106909 
" clip-path="url(#p37ab72b1bb)" style="fill: none; stroke: #bd7139; stroke-width: 3; stroke-linecap: square"/>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #bd7139" x="490.65696" y="625.700848" transform="rotate(-0 490.65696 625.700848)">HISTORICAL EVALUATION</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17334c" x="490.65696" y="650.960732" transform="rotate(-0 490.65696 650.960732)">Lagged returns and risk review</text>
   </g>
   <g id="text_21">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5b6d79" transform="translate(490.65696 672.527601)">Bond-index benchmark, wealth and drawdowns;</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5b6d79" transform="translate(490.65696 686.384867)">attribute contributions and test robustness.</text>
   </g>
  </g>
  <g id="text_22">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007e87" x="47.52" y="36.432" transform="rotate(-0 47.52 36.432)">MACRO EVENT TRADING</text>
  </g>
  <g id="text_23">
   <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17334c" x="47.52" y="69.552" transform="rotate(-0 47.52 69.552)">From inflation information to duration allocation</text>
  </g>
  <g id="text_24">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5b6d79" x="47.52" y="96.048" transform="rotate(-0 47.52 96.048)">A daily economic proxy and a release surprise meet in one event signal.</text>
  </g>
  <g id="text_25">
   <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007e87" x="47.52" y="762.588" transform="rotate(-0 47.52 762.588)">TIMING CHECK</text>
  </g>
  <g id="text_26">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17334c" x="47.52" y="783.288" transform="rotate(-0 47.52 783.288)">Pre-release proxy → actual CPI announcement → final target → one-record lag in returns</text>
  </g>
  <g id="text_27">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5b6d79" x="47.52" y="804.816" transform="rotate(-0 47.52 804.816)">“Priced-in” is a proxy interpretation. Date-level timing and executable fills still require validation.</text>
  </g>
